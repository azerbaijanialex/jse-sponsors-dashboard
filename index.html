<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>JSE Sponsor Tracker</title>
<style>
:root{color-scheme:light;--bg:#f6f6f4;--surface:#fcfcfb;--border:#e3e2de;--text:#0b0b0b;--muted:#6d6c67;--accent:#2a78d6;--crit:#c23b3a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121211;--surface:#1a1a19;--border:#2f2f2c;--text:#f0efec;--muted:#8f8e86;--accent:#3987e5;--crit:#e66767}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--border:#2f2f2c;--text:#f0efec;--muted:#8f8e86;--accent:#3987e5;--crit:#e66767}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;width:100%;max-width:360px}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
input[type=password]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
label.r{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--muted);font-size:13px}
button{width:100%;font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:10px;cursor:pointer}
#err{color:var(--crit);font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f"><h1>JSE Sponsor Tracker</h1><p>Private dashboard. Enter the password to open it.</p>

<label class="r"><input type="checkbox" id="rem"> Remember on this device</label>
<button type="submit" id="go">Open dashboard</button><div id="err" role="alert"></div></form>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b(SALT), iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function openWith(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(IV)}, key, b(CT));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function tryStored(){
  let raw=null; try{ raw = localStorage.getItem("jst-key-" + SALT); }catch(e){}
  if(!raw) return;
  try{
    const key = await crypto.subtle.importKey("raw", b(raw), {name:"AES-GCM"}, false, ["decrypt"]);
    await openWith(key);
  }catch(e){ try{localStorage.removeItem("jst-key-" + SALT);}catch(_){} }
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value, err = document.getElementById("err"), go = document.getElementById("go");
  go.disabled = true; go.textContent = "Unlocking…"; err.textContent = "";
  try{
    const key = await keyFrom(pw);
    await crypto.subtle.decrypt({name:"AES-GCM", iv:b(IV)}, key, b(CT));  // throws if wrong
    if (document.getElementById("rem").checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      try{ localStorage.setItem("jst-key-" + SALT, btoa(String.fromCharCode(...raw))); }catch(e){}
    }
    await openWith(key);
  }catch(e){ err.textContent = "Wrong password."; go.disabled = false; go.textContent = "Open dashboard"; }
});
// replace the document only after the lock page has fully loaded (document.write during
// parsing would insert instead of replace)
if (document.readyState === "complete") tryStored(); else addEventListener("load", tryStored);
